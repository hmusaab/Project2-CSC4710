<!DOCTYPE html> <!-- For out interface we will use HTML and not react, react file is not used in profs project1 directory on github, yt video listed also used html and not react-->
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Main Page - Client Registration</title>
        <link rel="stylesheet" href="index.css"> <!--adding css via external css stylesheet-->
    </head>
    <body style="font-family: Arial;">
        <h3>Want To Be A Client? Register Below!</h3>
        <div> 
            <!--Our js file will go to this route-->
        <a href="ClientSignIn.html">Already A Registered Client?</a>
        <a href="ContractorSignIn.html" style="display:block">Are You Anna The Contractor?</a>
        <form action="http://localhost:5050/insert" method="POST"><!--The attribute action tells the html webpage where the user input data from the form should be sent to (via URL), attribute method says how said data should be sent-->
<!-- localhoast lit refers to 'this machine' as it's ran locally-->
            
            <p>Your Regstration Date:</p> <p id="date"></p>
            <input type="hidden" name="RegisterDate" id="date2">
            <script>
             Object = new Date();
             Year = Object.getFullYear();
             Month = Object.getMonth() + 1;
             Day = Object.getDate();
             document.getElementById("date").innerHTML = Month + "/" + Day + "/" + Year;
             document.getElementById("date2").value = Month + "/" + Day + "/" + Year;
            </script>
            
            
            <label>First Name:</label> <!--Note that we use the value of the name attribute to send the user input data on the form to our database, IOW, name attribute needed to send data to database, NOT the id attribute (this is used for css or js), only works for form type elements nested in the <form> element/tag for http request to prorperly package and  -->
            <input type="text" name="FirstName" required>

            <label>Last Name:</label>
            <input type="text" name="LastName" required>

            <label>Address:</label>
            <input type="text" name="Primary_Address" required>
 
            <label>Phone Number:</label>
            <input type="number" name="Phone_Number" required>
            
            <label>Email:</label>
            <input type="text" name="Email" required>

            <label>Credit Card Number:</label>
            <input type="number" name="CreditCardNumber" required>

            <label>Credit Card Code:</label>
            <input type="number" name="CreditCardCode" required>

            <input type="hidden" name="LastSignInTime">


            <input type="hidden" name="ClientID">
            
            <button>Finish</button> <!-- Button doesnt need any attributes but must be included/nested -->
        </form>
        </div>
    </body>
</html>

<script>
    //this frontend javascript will be used to create a unique ID for the client. Once, client presses
    var Random = "ID" + Math.random(16).toString(2);

    window.addEventListener("DOMContentLoaded", () =>{
    document.getElementById("ClientID").name = Random;
    });
</script>

<script>
    //this frontend javascript is used to fetch and execute the details from the response.json
    fetch("/register", {
        method: "POST",
        body: new FormData(form)
    })
    .then(response => response.json())
    .then(data => {
        alert(data.message); //this will tell the client their ClientID
        window.location.href = data.redirect; //redirect the user to SignIn.html
    });
</script>

<!-- When you want the Frontend to send user inputted data to the backend, do the following -->
 <!-- 1) Must use the <form> element and the use the allowed form elements to capture user input like <input>, <button>, etc-->
<!-- 2) The <form> element must have the action attribute along with the http method attribute (POST, GET, DELETE, etc) use whichever one depending on your goal-->
<!-- 3) Now you can nest/use the allowed form elements that can send user data to the backend inside of the <form> element like (<input>, <button>, etc) wit the name attribute-->
<!-- 4) Button doesnt need any attributes but must be included/nested inorder for the browser to automatically send data to Backend. However, the page will reload -->
 <!-- 5) If you do not want the page to reload but still send data from Frontend to Backend then you will use addeventlistner and this button will have attributes, button should still be nested inside of <form> and you still need the necessary attributes in the <form>-->
