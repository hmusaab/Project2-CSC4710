<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Submit Service Request</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body style="font-family: Arial;">
        <h2>Submit a Service Request</h2>
        <h3>Success! Welcome back client: </h3>
        <p id="UserDisplay"></p>
        <script>
            const Params = new URLSearchParams(window.location.search);
            const ClientID = Params.get('User');
            document.getElementById("UserDisplay").textContent = ClientID;
        </script>
        <div>
            <a href="SignIn.html">Back to Sign In</a> | 
            <a href="RequestStatus.html">View My Requests</a> |
            <a href="ClientOrdersBills.html">My Orders & Bills</a>
            
            <form action="http://localhost:5050/plugin" method="POST">
            <!--<form id="serviceRequestForm"> -->
                <label>Client ID:</label>
                <input type="text" name="ClientID" id="ClientID" required>

                <label>Service Address:</label>
                <input type="text" name="Service_Address" id="Service_Address" required>

                <label>Cleaning Type:</label>
                <select name="Cleaning_Type" id="Cleaning_Type" required>
                    <option value="">Select Type</option>
                    <option value="Basic">Basic Cleaning</option>
                    <option value="Deep">Deep Cleaning</option>
                    <option value="Move-in/out">Move-in/out Cleaning</option>
                </select>

                <label>Number of Rooms:</label>
                <input type="number" name="Rooms" id="Rooms" required min="1">
     
                <label>Preferred Date:</label>
                <input type="date" name="Pref_Date" id="Pref_Date" required>
                
                <label>Preferred Time:</label>
                <input type="time" name="Pref_Time" id="Pref_Time" required>

                <label>Preferred Budget ($):</label>
                <input type="number" name="Pref_Budget" id="Pref_Budget" required step="0.01" min="0">

                <label>Optional Note:</label>
                <textarea name="Optional_Note" id="Optional_Note" rows="4" placeholder="Any special requirements or notes..."></textarea>
                
                <button type="submit">Submit Request</button>
            </form>
        </div>
        
        <script>
            
            document.getElementById('serviceRequestForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const formData = {
                    ClientID: document.getElementById('ClientID').value,
                    Service_Address: document.getElementById('Service_Address').value,
                    Cleaning_Type: document.getElementById('Cleaning_Type').value,
                    Rooms: document.getElementById('Rooms').value,
                    Pref_Date: document.getElementById('Pref_Date').value,
                    Pref_Time: document.getElementById('Pref_Time').value,
                    Pref_Budget: document.getElementById('Pref_Budget').value,
                    Optional_Note: document.getElementById('Optional_Note').value
                };
                
                try {
                    const response = await fetch('http://localhost:5050/submit-service-request', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(formData)
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        alert('Service request submitted successfully! Request ID: ' + result.requestId);
                        document.getElementById('serviceRequestForm').reset();
                        
                        // Optionally redirect to status page
                        if (confirm('Would you like to view your request status?')) {
                            window.location.href = 'RequestStatus.html';
                        }
                    } else {
                        alert('Failed to submit service request. Please try again.');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error submitting service request. Please check your connection.');
                }
            });
        </script>
    </body>
</html>

<!-- When you want the Frontend to send user inputted data to the backend, do the following -->
 <!-- 1) Must use the <form> element and the use the allowed form elements to capture user input like <input>, <button>, etc-->
<!-- 2) The <form> element must have the action attribute along with the http method attribute (POST, GET, DELETE, etc) use whichever one depending on your goal-->
<!-- 3) Now you can nest/use the allowed form elements that can send user data to the backend inside of the <form> element like (<input>, <button>, etc) wit the name attribute-->
<!-- 4) Button doesnt need any attributes but must be included/nested inorder for the browser to automatically send data to Backend. However, the page will reload -->
 <!-- 5) If you do not want the page to reload but still send data from Frontend to Backend then you will use addeventlistner and this button will have attributes, button should still be nested inside of <form> and you still need the necessary attributes in the <form>-->
